name: Feature proposal
description: Propose a capability or improvement for orbit-secrets-aws-aws.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
      description: Describe the user need and the observable outcome you want.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Ownership and contract
      description: Explain which Orbit capability or provider owns the behavior and the public contract it should expose.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility
      description: Describe alternatives considered and any API, security, operational, or compatibility impact.
    validations:
      required: true
